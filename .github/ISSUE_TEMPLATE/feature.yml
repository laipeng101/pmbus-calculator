name: Feature request
description: 新功能或里程碑任务
title: '[Feature] '
labels: ['enhancement']
body:
  - type: dropdown
    id: mode
    attributes:
      label: 影响模式
      options:
        - GLOBAL
        - L11
        - L16
        - DIRECT
        - HALF
        - VOUT_MODE
        - COPY
        - COMMAND
        - THEME
        - CI/Docs
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 说明使用场景和希望实现的行为。
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: 规范来源
      description: PMBus 章节、器件数据手册、IEEE 754、参考实现链接等
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 示例
      description: 提供典型输入、期望输出或用户操作路径。
  - type: textarea
    id: risks
    attributes:
      label: 风险与未知
      description: 需要确认的规范、舍入、字节序或器件 profile 问题
