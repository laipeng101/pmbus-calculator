name: Bug report
description: 缺陷报告
title: '[Bug] '
labels: ['bug']
body:
  - type: dropdown
    id: mode
    attributes:
      label: 影响模式
      options:
        - GLOBAL
        - L11
        - L16
        - DIRECT
        - HALF
        - VOUT_MODE
        - COPY
        - COMMAND
        - THEME
        - CI/Docs
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 提供最短复现步骤。涉及换算时附输入值、Raw Word 或 VOUT_MODE 字节。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 说明期望的结果或界面行为。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: 规范来源
      description: PMBus 章节、IEEE 754、参考实现链接等
  - type: textarea
    id: version
    attributes:
      label: 环境
      description: 提供使用的站点或 App 版本及浏览器。若是本地工具链问题，请附 Node.js、npm 与操作系统版本。
    validations:
      required: true
