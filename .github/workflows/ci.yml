name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cost-aware CI cancellation (M18): a new push to a PR cancels that PR's
# outdated run. Different PRs, PR vs main, and main pushes never share a
# group; main never cancels in progress so every merge SHA keeps its
# verification evidence.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      # Single source of truth for the light/full split: scripts/classify-ci-scope.mjs
      # (fail closed — anything not proven light runs the full tier below).
      # `!= 'false'` keeps the gate fail-closed if this step ever dies without
      # writing outputs.
      - name: Classify CI scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-ci-scope.mjs --event "$EVENT_NAME" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Repository hygiene gate
        run: npm run check:repo-hygiene

      - name: Format check
        run: npm run format:check

      - name: Markdown math gate
        run: npm run check:markdown-math

      - name: Specification manifest check
        if: steps.scope.outputs.run_full != 'false'
        run: npm run specs:check

      - name: Type check
        if: steps.scope.outputs.run_full != 'false'
        run: npm run typecheck

      - name: Lint
        if: steps.scope.outputs.run_full != 'false'
        run: npm run lint

      - name: Unit tests with coverage
        if: steps.scope.outputs.run_full != 'false'
        run: npm run test:coverage

      - name: Install Playwright browsers
        if: steps.scope.outputs.run_full != 'false'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        if: steps.scope.outputs.run_full != 'false'
        run: npm run test:e2e

      - name: Build
        if: steps.scope.outputs.run_full != 'false'
        run: npm run build

      - name: Tailwind source scope gate
        if: steps.scope.outputs.run_full != 'false'
        run: npm run check:tailwind-scope

      - name: Run production release smoke
        if: steps.scope.outputs.run_full != 'false'
        run: npm run test:e2e:release

      - name: Check full PR diff for whitespace errors
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Check full pushed range for whitespace errors
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git show --check --stat --oneline "$HEAD_SHA"
          else
            git diff --check "$BEFORE_SHA" "$HEAD_SHA"
          fi

      - name: Audit dependencies
        if: steps.scope.outputs.run_full != 'false'
        run: npm audit --audit-level=high

      # Playwright reports only exist in the full tier; keep light-tier
      # failures from trying to upload directories that were never produced.
      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.scope.outputs.run_full != 'false'
        with:
          name: playwright-report
          path: tests/e2e/report
          retention-days: 7

      - name: Upload Playwright release smoke report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.scope.outputs.run_full != 'false'
        with:
          name: playwright-report-release
          path: tests/e2e/report-release
          retention-days: 7
