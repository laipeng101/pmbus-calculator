name: CI

# main is protected (ruleset "protect-main": PR required, required `check`
# from GitHub Actions, strict up-to-date, no bypass, no force push, no
# deletion). PR CI tests the merge ref by default, so the tested tree equals
# the post-merge main tree and a second post-merge CI run would re-verify the
# identical tree — the push trigger is therefore removed. workflow_dispatch
# stays as the emergency/manual full-verification entry.
#
# Parallel verification layout:
#   quality       — format, typecheck, lint, coverage, build, base contracts
#   e2e           — Playwright install, user flows, release smoke
#   compatibility — Node 22 typecheck + unit tests
#   check         — light aggregator (the branch-protection required check)
#                   that records the checked revision and runs the full
#                   PR base→head whitespace gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cost-aware CI cancellation: a new push to a PR cancels that PR's outdated
# run. Different PRs never share a group. Manual workflow_dispatch runs group
# by ref (never a PR number) and cancel-in-progress is PR-only, so a manual
# run neither cancels nor is cancelled by PR runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      # Single source of truth for the light/full split: scripts/classify-ci-scope.mjs
      # (fail closed — anything not proven light runs the full tier below).
      # `!= 'false'` keeps the gate fail-closed if this step ever dies without
      # writing outputs.
      - name: Classify CI scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-ci-scope.mjs --event "$EVENT_NAME" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Repository hygiene gate
        run: npm run check:repo-hygiene

      - name: Format check
        run: npm run format:check

      - name: Markdown math gate
        run: npm run check:markdown-math

      # v2.5.13: release-operator docs (docs/RELEASING.md) and the Pages
      # workflow must keep matching the real verifier CLI. Deliberately NOT
      # behind the full-tier condition: docs-only PRs are classified light,
      # and this cheap offline contract is exactly the gate they need (the
      # PR #74 lesson). scripts/ changes classify full anyway.
      - name: Release docs command contract
        run: npm run check:release-docs-commands

      - name: Type check
        if: steps.scope.outputs.run_full != 'false'
        run: npm run typecheck

      - name: Lint
        if: steps.scope.outputs.run_full != 'false'
        run: npm run lint

      - name: Inline style gate
        if: steps.scope.outputs.run_full != 'false'
        run: npm run check:inline-style

      - name: Specification manifest check
        if: steps.scope.outputs.run_full != 'false'
        run: npm run specs:check

      - name: Release contract check
        if: steps.scope.outputs.run_full != 'false'
        run: npm run check:release-contract

      - name: Canonical toolchain check
        if: steps.scope.outputs.run_full != 'false'
        run: npm run check:toolchain

      - name: Unit tests with coverage
        if: steps.scope.outputs.run_full != 'false'
        run: npm run test:coverage

      - name: Build
        if: steps.scope.outputs.run_full != 'false'
        run: npm run build

      - name: Tailwind source scope gate
        if: steps.scope.outputs.run_full != 'false'
        run: npm run check:tailwind-scope

      - name: Audit dependencies
        if: steps.scope.outputs.run_full != 'false'
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Classify CI scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-ci-scope.mjs --event "$EVENT_NAME" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.scope.outputs.run_full != 'false'
        run: npx playwright install --with-deps chromium

      # v2.5.15: the desktop semantic suite and the mobile-contract suite are
      # the primary acceptance targets and verify the PRODUCTION build
      # (`vite preview` of the exact dist/ under the official Pages prefix).
      # Build once here, before any suite; the release smoke consumes the same
      # dist without rebuilding.
      - name: Build for production E2E
        if: steps.scope.outputs.run_full != 'false'
        run: npm run build

      - name: Run Playwright E2E
        id: e2e
        if: steps.scope.outputs.run_full != 'false'
        run: npm run test:e2e

      # v2.5.13: the explicit mobile-contract suite (Pixel 7 emulation) runs
      # after the desktop suite on the same production dist; together they
      # replace the old run-everything-twice desktop+mobile project
      # duplication.
      - name: Run Playwright mobile contract E2E
        id: e2e_mobile
        if: steps.scope.outputs.run_full != 'false'
        run: npm run test:e2e:mobile

      - name: Run production release smoke
        id: release_smoke
        if: steps.scope.outputs.run_full != 'false'
        run: npm run test:e2e:release

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() &&
          steps.scope.outputs.run_full != 'false' &&
          steps.e2e.outcome == 'failure'
        with:
          name: playwright-report
          path: tests/e2e/report
          retention-days: 7

      - name: Upload Playwright mobile contract report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() &&
          steps.scope.outputs.run_full != 'false' &&
          steps.e2e_mobile.outcome == 'failure'
        with:
          name: playwright-report-mobile
          path: tests/e2e/report-mobile
          retention-days: 7

      - name: Upload Playwright release smoke report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() &&
          steps.scope.outputs.run_full != 'false' &&
          steps.release_smoke.outcome == 'failure'
        with:
          name: playwright-report-release
          path: tests/e2e/report-release
          retention-days: 7

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # engines deliberately supports the two maintained LTS lines (22 and
      # 24). Primary verification runs on the canonical Node 24.19.0 from
      # .node-version (quality/e2e jobs); this job reinstalls under the exact
      # compatibility Node 22.20.0 and runs the real `tsc -b` typecheck plus
      # the unit suite so the runtime floor stays continuously validated.
      - name: Setup Node.js 22.20.0 (compatibility LTS)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.20.0'
          # The canonical runtime already restored the npm download cache, so
          # the compatibility runtime must NOT establish a second cache;
          # node_modules is never cached. package-manager-cache: false also
          # disables setup-node v7's auto-detected npm cache, which probes
          # with the bundled npm 10.9.3 and fails its devEngines fail-closed
          # check (EBADDEVENGINES) -- the canonical npm 11.17.0 is activated
          # in the next step, outside the repo.
          package-manager-cache: false

      - name: Classify CI scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-ci-scope.mjs --event "$EVENT_NAME" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

      # Both CI runtimes use the exact canonical npm 11.17.0 (Node 24.19.0
      # ships it; the 22.20.0 runtime needs the explicit pin). `cd /tmp` keeps
      # the install OUTSIDE the repo so the bundled npm 10.9.3 never reads the
      # repo's devEngines while upgrading itself.
      - name: Activate canonical npm 11.17.0 on compatibility runtime
        if: steps.scope.outputs.run_full != 'false'
        run: cd /tmp && npm install -g npm@11.17.0

      - name: Typecheck and unit tests on compatibility LTS (Node 22.20.0)
        if: steps.scope.outputs.run_full != 'false'
        run: npm ci && npm run typecheck && npm run test:run

  check:
    # The aggregator is the branch-protection required check, so it must run
    # (and fail closed) even when an upstream verification job fails, is
    # cancelled, or is skipped. Without always(), GitHub would skip the whole
    # job on upstream failure and treat the skipped required check as green.
    if: ${{ always() }}
    needs: [quality, e2e, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Evidence for the no-second-CI model: record the exact commit and tree
      # that this run verified. The final report compares this tree with the
      # post-merge main tree instead of re-running a full CI.
      - name: Record checked revision
        id: revision
        run: |
          set -euo pipefail
          checked_sha="$(git rev-parse HEAD)"
          checked_tree="$(git rev-parse 'HEAD^{tree}')"
          for value in "$checked_sha" "$checked_tree"; do
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "revision: not a 40-hex SHA: $value" >&2
              exit 1
            fi
          done
          {
            echo "checked_sha=$checked_sha"
            echo "checked_tree=$checked_tree"
          } >> "$GITHUB_OUTPUT"
          echo "revision: checked_sha=$checked_sha checked_tree=$checked_tree"
          {
            echo "### Checked revision"
            echo "- commit \`${checked_sha}\`"
            echo "- tree \`${checked_tree}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require successful parallel verification results
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: |
          set -euo pipefail

          echo "quality=${QUALITY_RESULT}"
          echo "e2e=${E2E_RESULT}"
          echo "compatibility=${COMPATIBILITY_RESULT}"

          for result in \
            "$QUALITY_RESULT" \
            "$E2E_RESULT" \
            "$COMPATIBILITY_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              echo "A required verification job did not succeed." >&2
              exit 1
            fi
          done

      - name: Check full PR diff for whitespace errors
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"
