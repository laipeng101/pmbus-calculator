name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check PR whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check HEAD^1 HEAD --

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Detect documentation-only changes
        id: scope
        if: github.event_name == 'pull_request'
        run: node scripts/classify-ci-scope.mjs

      - run: npm ci --no-audit
      - run: npm run verify:light
        if: steps.scope.outputs.docs_only == 'true'
      - run: npm run verify
        if: steps.scope.outputs.docs_only != 'true'
      - run: npx playwright install --with-deps --only-shell chromium
        if: steps.scope.outputs.docs_only != 'true'
      - run: npm run verify:browser
        if: steps.scope.outputs.docs_only != 'true'

      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-reports-${{ github.run_attempt }}
          path: tests/e2e/report*
          retention-days: 7
          if-no-files-found: ignore
