name: Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable GitHub Release tag to deploy
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04 # Keep the runner compatible with the locked Playwright version.
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Forks may build the app, but only the official repository may deploy it.
      - name: Verify official Pages repository
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "laipeng101/pmbus-calculator" ]; then
            echo "::error::Pages deployment requires the official repository" >&2
            exit 1
          fi

      # Bind the checkout to the release before reading code from the tag.
      - name: Resolve release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          else
            # A manual dispatch deploys the INPUT tag only from that exact tag
            # ref: a run started on main, any branch, or a different tag can
            # never inject another tag here.
            if [ "$REF_TYPE" != "tag" ]; then
              echo "::error::workflow_dispatch must be run on a tag ref (got ref_type: ${REF_TYPE})"
              exit 1
            fi
            if [ "$REF_NAME" != "$INPUT_RELEASE_TAG" ]; then
              echo "::error::workflow_dispatch ref (${REF_NAME}) must equal inputs.release_tag (${INPUT_RELEASE_TAG})"
              exit 1
            fi
            echo "tag=${INPUT_RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate stable SemVer tag format
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[1-9][0-9]*\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::release_tag must be a stable version tag like v1.2.3.'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          persist-credentials: false

      - name: Verify checkout matches the resolved tag
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          tag_type="$(git cat-file -t "refs/tags/${RELEASE_TAG}")"
          if [ "$tag_type" != "tag" ]; then
            echo "::error::refs/tags/${RELEASE_TAG} must be an annotated tag (got: ${tag_type})"
            exit 1
          fi
          peeled="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if ! printf '%s' "$peeled" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::peeled tag commit is not a 40-hex SHA: ${peeled}"
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          if [ "$head_sha" != "$peeled" ]; then
            echo "::error::checked-out HEAD ${head_sha} != peeled tag commit ${peeled}"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify GitHub Release metadata and Git tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 10 --max-time 60 --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > release-metadata.json

          jq -e --arg tag "${RELEASE_TAG}" '.tag_name == $tag' release-metadata.json >/dev/null

          # Verify asset readiness before download. Treat metadata as JSON data.
          node scripts/release-assets-verify.mjs release-metadata.json \
            --tag "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --mode published \
            > release-assets.json
          jq -e '.zip.url and .sums.url' release-assets.json >/dev/null
          cat release-assets.json

          ref_json="$(curl -fsSL --connect-timeout 10 --max-time 60 --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          echo "${ref_json}" | jq -e '
            .object.type as $type | ($type == "commit" or $type == "tag")
          ' >/dev/null || { echo "::error::Git tag validation failed for ${RELEASE_TAG}"; exit 1; }

      - name: Download release assets
        run: |
          set -euo pipefail
          node scripts/download-release-assets.mjs release-assets.json \
            --repo "${GITHUB_REPOSITORY}" --out-dir .

      - name: Verify downloaded release assets
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          node scripts/verify-downloaded-assets.mjs \
            --metadata release-metadata.json --dir . \
            --tag "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --mode published \
            > downloaded-assets.json

      # A valid ZIP and checksum do not prove that the ZIP came from this tag.
      - name: Rebuild release zip from the tagged source
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          pkg_version="$(jq -r '.version' package.json)"
          if [ "v${pkg_version}" != "${RELEASE_TAG}" ]; then
            echo "::error::package.json version (v${pkg_version}) does not match the deployed tag (${RELEASE_TAG})"
            exit 1
          fi
          npm run build
          npm run release:prepare-assets -- --force

      - name: Compare rebuilt zip with the release zip
        run: |
          set -euo pipefail
          zip_name="$(jq -er '.zip.name' downloaded-assets.json)"
          node scripts/verify-release-rebuild.mjs \
            --expected "$zip_name" \
            --actual "release-output/$zip_name" \
            > rebuilt-release-zip.json

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Smoke-test the rebuilt Release before preparing the Pages-specific site.
      - name: Run local release smoke
        id: release-smoke
        run: npm run test:e2e:release

      - name: Extract release assets to _site
        run: |
          set -euo pipefail
          zip_name="$(jq -er '.zip.name' downloaded-assets.json)"
          rm -rf _site
          mkdir -p _site
          unzip -q "$zip_name" -d _site

      # Pass the site token only to the steps that change and verify _site.
      - name: Apply Pages-only overlay
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: node scripts/apply-pages-overlay.mjs --site _site

      - name: Verify Pages-only overlay
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: node scripts/verify-pages-overlay.mjs --site _site

      - name: Run local Pages-overlay smoke
        id: pages-overlay-smoke
        run: npm run test:e2e:pages-overlay

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # Compare every deployed file against the final upload, including Pages-only changes.
      - name: Verify deployed Pages entities
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node scripts/verify-pages-entities.mjs \
            --site _site --base-url "${DEPLOYMENT_URL}" \
            --query "${GITHUB_RUN_ID}" \
            > pages-entities.json

      - name: Run remote deployment smoke
        id: smoke
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run test:e2e:deployment

      # Failure here means Pages deployed and third-party acceptance failed.
      - name: Real Cloudflare Analytics acceptance
        id: live-analytics
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: node scripts/verify-live-analytics.mjs

      - name: Upload local release smoke report on failure
        if: failure() && steps.release-smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-release
          path: tests/e2e/report-release
          retention-days: 7

      - name: Upload local Pages-overlay smoke report on failure
        if: failure() && steps.pages-overlay-smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-pages-overlay
          path: tests/e2e/report-pages-overlay
          retention-days: 7

      - name: Upload deployment smoke report on failure
        if: failure() && steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-deployment
          path: tests/e2e/report-deployment
          retention-days: 7
