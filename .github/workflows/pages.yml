name: Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable GitHub Release tag to deploy
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Tag resolution and SemVer validation are pure shell: they need no
      # repository source and must run BEFORE checkout so the checkout ref
      # itself is bound to the exact release tag.
      - name: Resolve release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          else
            # A manual dispatch deploys the INPUT tag only from that exact tag
            # ref: a run started on main, any branch, or a different tag can
            # never inject another tag here.
            if [ "$REF_TYPE" != "tag" ]; then
              echo "::error::workflow_dispatch must be run on a tag ref (got ref_type: ${REF_TYPE})"
              exit 1
            fi
            if [ "$REF_NAME" != "$INPUT_RELEASE_TAG" ]; then
              echo "::error::workflow_dispatch ref (${REF_NAME}) must equal inputs.release_tag (${INPUT_RELEASE_TAG})"
              exit 1
            fi
            echo "tag=${INPUT_RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate stable SemVer tag format
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[1-9][0-9]*\.[0-9]+\.[0-9]+$'; then
            echo "::error::release_tag must match ^v[1-9][0-9]*\.[0-9]+\.[0-9]+$ (got: $RELEASE_TAG)"
            exit 1
          fi
          echo "VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          persist-credentials: false

      # The verifier scripts (release-assets-verify / download /
      # verify-downloaded-assets) run from this working tree, so the tree
      # itself must be the deployed tag: an annotated tag object, a 40-hex
      # peeled commit, and a detached HEAD exactly at that commit.
      - name: Verify checkout matches the resolved tag
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          tag_type="$(git cat-file -t "refs/tags/${RELEASE_TAG}")"
          if [ "$tag_type" != "tag" ]; then
            echo "::error::refs/tags/${RELEASE_TAG} must be an annotated tag (got: ${tag_type})"
            exit 1
          fi
          peeled="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if ! printf '%s' "$peeled" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::peeled tag commit is not a 40-hex SHA: ${peeled}"
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          if [ "$head_sha" != "$peeled" ]; then
            echo "::error::checked-out HEAD ${head_sha} != peeled tag commit ${peeled}"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify GitHub Release metadata and Git tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # Metadata fetch: connect + total timeout; --retry covers transient
          # transport failures only (with -f, permanent 4xx contract errors
          # fail fast and are never retried).
          curl -fsSL --connect-timeout 10 --max-time 60 --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > release-metadata.json

          # The metadata must describe exactly the resolved tag, not merely
          # "a release found for this tag path".
          jq -e --arg tag "${RELEASE_TAG}" '.tag_name == $tag' release-metadata.json >/dev/null

          # Asset readiness gate (v2.5.8, scripts/release-assets-verify.mjs):
          # draft/prerelease/tag contract, asset presence, uniqueness,
          # uploaded state, positive size and canonical URL — each failure
          # class reports its own error and exit code (2-8). This must fail
          # BEFORE any download or deploy action; the v2.5.7 publish-before-upload
          # race surfaces here as a clear contract error, not an exit 4.
          # Since v2.5.9 stdout is ONE JSON object (data, not shell program):
          # the previous key=value env file was consumed with `source`, which
          # executed command substitutions embedded in metadata strings.
          node scripts/release-assets-verify.mjs release-metadata.json \
            --tag "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --mode published \
            > release-assets.json
          jq -e '.zip.url and .sums.url' release-assets.json >/dev/null
          cat release-assets.json

          ref_json="$(curl -fsSL --connect-timeout 10 --max-time 60 --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          echo "${ref_json}" | jq -e '
            .object.type as $type | ($type == "commit" or $type == "tag")
          ' >/dev/null || { echo "::error::Git tag validation failed for ${RELEASE_TAG}"; exit 1; }

      - name: Download release assets
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # URLs and sizes were resolved and contract-validated by
          # release-assets-verify.mjs; the JSON is consumed as DATA by the
          # Node downloader (no source/eval), every URL is re-validated
          # against the canonical github.com/<repo>/releases/download contract
          # and downloaded bytes are checked against the verified metadata
          # before anything is written (mismatch exits 9). Metadata text is
          # never interpreted as code, so the v2.5.9 boundary defect class
          # (command substitution inside metadata strings) cannot execute.
          node scripts/download-release-assets.mjs release-assets.json \
            --repo "${GITHUB_REPOSITORY}" --out-dir .

      # v2.5.12: the single downloaded-asset byte gate, shared with the
      # operator's draft pre-publish flow. Re-checks the metadata contract
      # in-process (release-assets-verify.mjs, strict published URL mode),
      # local presence and size, the SHA256SUMS.txt contract, the zip
      # checksum (node:crypto) and the shared python zip-safety verifier —
      # every failure class with its own exit code (2-8, 10-14), always
      # BEFORE extraction or deploy.
      - name: Verify downloaded release assets
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          node scripts/verify-downloaded-assets.mjs \
            --metadata release-metadata.json --dir . \
            --tag "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --mode published \
            > downloaded-assets.json

      # Release-to-source provenance binding: the checked-out tree IS the
      # resolved annotated tag (verified above), so a fresh deterministic
      # build + asset generation from it must reproduce the downloaded
      # release zip byte-for-byte. A zip that is well-formed, safely
      # packaged and checksum-consistent but was NOT produced from the
      # tagged source fails here — before extraction or deployment.
      - name: Rebuild release zip from the tagged source
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # package.json version is the single release-naming source
          # (check:release-contract); assert it matches the deployed tag so
          # the rebuilt asset name cannot silently diverge from the
          # downloaded one.
          pkg_version="$(jq -r '.version' package.json)"
          if [ "v${pkg_version}" != "${RELEASE_TAG}" ]; then
            echo "::error::package.json version (v${pkg_version}) does not match the deployed tag (${RELEASE_TAG})"
            exit 1
          fi
          npm run build
          npm run release:prepare-assets -- --force

      - name: Compare rebuilt zip with the release zip
        env:
          VERSION: ${{ steps.resolve.outputs.tag }}
        run: |
          node scripts/verify-release-rebuild.mjs \
            --expected "pmbus-calculator-${VERSION}-web.zip" \
            --actual "release-output/pmbus-calculator-${VERSION}-web.zip" \
            > rebuilt-release-zip.json

      # All preparable deploy preconditions live BEFORE actions/deploy-pages:
      # if any of them fails, the previous published site stays untouched.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Local release smoke on the SAME bytes that will be deployed: the
      # rebuilt dist is byte-bound to the downloaded release zip by the
      # comparison step above, so this smoke exercises the deploy payload
      # before anything is published. Only smokes that need the live
      # deployment URL run after deploy-pages.
      - name: Run local release smoke
        id: release-smoke
        run: npm run test:e2e:release

      - name: Extract release assets to _site
        env:
          VERSION: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          unzip -q "pmbus-calculator-${VERSION}-web.zip" -d _site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Run remote deployment smoke
        id: smoke
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run test:e2e:deployment

      - name: Upload local release smoke report on failure
        if: failure() && steps.release-smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-release
          path: tests/e2e/report-release
          retention-days: 7

      - name: Upload deployment smoke report on failure
        if: failure() && steps.deployment.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-deployment
          path: tests/e2e/report-deployment
          retention-days: 7
